name: KH Apple Silicon verification

on:
  push:
    branches: [enhance/kh-notes-workspace, enhance/kh-workspace-v2]
  pull_request:
    branches: [main, devtest]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kh-macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'kilhyeonjun/meetily'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      APPLE_SIGNING_IDENTITY: '-'
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend behavioral suites
        working-directory: frontend
        run: node ../.github/scripts/run-frontend-tests.mjs "$RUNNER_TEMP/frontend-test-results.json"
      - name: TypeScript
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Next production build
        working-directory: frontend
        run: pnpm build
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - name: Build summary sidecar
        run: |
          cargo +stable build --locked --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      - name: Rust library behavioral tests
        run: cargo +stable test --locked -p meetily --lib -- --test-threads=2
      - name: Build isolated KH app
        working-directory: frontend
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app --config src-tauri/tauri.kh.conf.json
      - name: Package and verify ad-hoc app signature
        run: |
          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/Meetily KH.app"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Meetily-KH-arm64.zip"
          shasum -a 256 "$RUNNER_TEMP/Meetily-KH-arm64.zip" > "$RUNNER_TEMP/Meetily-KH-arm64.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: Meetily-KH-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Meetily-KH-arm64.zip
            ${{ runner.temp }}/Meetily-KH-arm64.sha256
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-test-timings-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-test-results.json
          retention-days: 1
